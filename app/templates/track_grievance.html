<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View status updates for a grievance-service request.">
    <title>Track grievance | CM Kerala Grievance Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="{{ url_for('static', path='/js/grievances.js') }}" defer></script>
  </head>
  <body class="auth-page" data-auth-page="track">
    <header class="site-header">
      <a class="brand" href="/" aria-label="CM Kerala Grievance Portal home">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>CM Kerala<span class="brand-subtitle">Public Grievance Portal</span></span>
      </a>
      <a class="button button-outline" href="/citizen/dashboard">Dashboard</a>
    </header>
    <main class="dashboard-main track-main">
      <p class="eyebrow">CITIZEN PORTAL</p>
      <h1>Track a grievance</h1>
      <p class="auth-intro">Enter the reference number for a grievance submitted from your account.</p>
      <form id="track-form" class="track-form">
        <label for="reference-number">Reference number</label>
        <div class="track-input-row">
          <input id="reference-number" name="reference_number" type="text" placeholder="GMK-2026-XXXXXXXX" pattern="GMK-[0-9]{4}-[A-Fa-f0-9]{8}" required>
          <button class="button button-primary" type="submit">Track</button>
        </div>
      </form>
      <div id="track-message" class="dashboard-message" role="status" aria-live="polite"></div>
      <section id="track-result" class="track-result" hidden aria-live="polite"></section>
      <a class="button button-text" href="/citizen/dashboard">← Back to dashboard</a>
    </main>
    <footer class="site-footer">
      <span>CM Kerala Grievance Portal</span>
      <span>Independent demonstration · Not an official government service</span>
    </footer>
  </body>
</html>
