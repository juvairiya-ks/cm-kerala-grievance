<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | CM Kerala Grievance Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="{{ url_for('static', path='/js/public_services.js') }}" defer></script>
  </head>
  <body>
    {% include "public_header.html" %}
    <main class="content-page">
      <p class="eyebrow">CONTACT</p>
      <h1>Send a question or suggestion.</h1>
      <p class="page-lead">Send a question or suggestion about this service demonstration. This form is not monitored for official grievance handling.</p>
      <form id="contact-form" class="auth-form content-card">
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" autocomplete="name" minlength="2" maxlength="100" required>
        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="contact-subject">Subject</label>
        <input id="contact-subject" name="subject" minlength="3" maxlength="150" required>
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" minlength="10" maxlength="3000" rows="6" required></textarea>
        <p id="contact-status" class="form-message" role="status" aria-live="polite"></p>
        <button class="button button-primary auth-submit" type="submit">Send message</button>
      </form>
    </main>
    {% include "public_footer.html" %}
  </body>
</html>
